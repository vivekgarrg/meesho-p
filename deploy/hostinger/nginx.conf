# Nginx reverse proxy for the Django app.
# Copy to: /etc/nginx/sites-available/meesho
# Enable:  sudo ln -s /etc/nginx/sites-available/meesho /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace your-domain.com with your real domain (or the VPS IP for testing).

server {
    listen 80;
    server_name rudam.in www.rudam.in;

    client_max_body_size 60M;   # matches Django's 50MB upload limit + overhead

    # Django/whitenoise already serves /static/, but letting nginx serve the
    # collected files is faster. Point this at backend/staticfiles.
    location /static/ {
        alias /home/deploy/meesho-p/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
