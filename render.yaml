services:
  - type: web
    name: meesho-p
    runtime: python
    rootDir: .
    buildCommand: |
      npm ci --prefix frontend
      npm run build --prefix frontend
      mkdir -p backend/templates
      cp backend/frontend_build/index.html backend/templates/index.html
      pip install -r backend/requirements.txt
      cd backend && python manage.py collectstatic --noinput
    startCommand: |
      cd backend && python manage.py migrate && python manage.py load_initial_data && python manage.py create_seed_users && gunicorn meesho_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      # Custom domain + Render's own subdomain (keep the onrender.com host so
      # the app still answers on it while DNS propagates).
      - key: DJANGO_ALLOWED_HOSTS
        value: "rudam.in,www.rudam.in,meesho-p.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://rudam.in,https://www.rudam.in"
      # Frontend is served same-origin, so CORS can be locked down.
      - key: CORS_ALLOW_ALL
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://rudam.in,https://www.rudam.in"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # ── Database: external MySQL for persistent, consistent data ──
      # Set this in the Render dashboard (Environment tab). Format:
      #   mysql://USER:PASSWORD@HOST:PORT/DBNAME
      # settings.py uses DATABASE_URL first, so DB_ENGINE/DB_* are ignored.
      - key: DATABASE_URL
        sync: false
